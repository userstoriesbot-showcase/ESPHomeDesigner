# Showcase fork only (never part of an upstream pull request).
version: 1
app:
  install: "npm ci"
  start: npm run dev -- --port {port} --host 0.0.0.0
  url: http://localhost:{port}
  readyPath: /
  readyStatus: 200
  runtime: node22
  env:
    NODE_ENV: development
demo:
  maxVideos: 1
  beforePass: true
